version: '3.8'

services:
  polymarket-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polymarket-monitor
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      # Mount logs directory for persistence (optional)
      - ./logs:/app/logs
    # Resource limits (adjust based on your needs)
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Network mode
    network_mode: bridge
